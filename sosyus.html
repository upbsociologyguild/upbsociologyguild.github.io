        <script>
            document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.3) return;
            const particle = document.createElement('span');
            particle.textContent = '🦋';
            particle.style.cssText = `
            position: fixed;
            left: ${e.clientX}px;
            top: ${e.clientY}px;
            font-size: 14px;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
            transition: transform 1s ease, opacity 1s ease;
            opacity: 1;
            `;
            document.body.appendChild(particle);
            requestAnimationFrame(() => {
            particle.style.transform = `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0.5)`;
            particle.style.opacity = '0';
            });
            setTimeout(() => particle.remove(), 1000);
        });
        </script>

        <script>
        const logo = document.querySelector('.logo');
        if (logo) {
            logo.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            logo.addEventListener('mouseenter', () => logo.style.transform = 'scale(1.15) rotate(-3deg)');
            logo.addEventListener('mouseleave', () => logo.style.transform = 'scale(1) rotate(0deg)');
        }
        </script>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.homebar a').forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.style.fontWeight = 'bold';
                link.style.textDecoration = 'underline';
                link.style.textUnderlineOffset = '6px';
                link.style.opacity = '1';
            }
            });
        });
        </script>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.so-con');
            if (!container) return;

            const expandBtn = document.createElement('button');
            expandBtn.innerHTML = 'Read Uninterrupted, Social Butterfly';
            expandBtn.style.cssText = `
                display: block;
                margin: 10px auto;
                padding: 6px 14px;
                font-size: 13px;
                font-family:'Verdana';
                border: none;
                border-radius: 20px;
                background: #4A154B;
                color: white;
                cursor: pointer;
                transition: transform 0.2s ease, background 0.2s ease;
            `;

            const originalStyles = container.style.cssText;
            let isExpanded = false;

            expandBtn.addEventListener('click', () => {
                isExpanded = !isExpanded;
                if (isExpanded) {
                    container.style.cssText = `
                        position: fixed !important;
                        top: 5vh !important;
                        left: 5vw !important;
                        width: 90vw !important;
                        height: 90vh !important;
                        z-index: 999999 !important;
                        box-shadow: 0 10px 40px rgba(0,0,0,0.8) !important;
                        border-radius: 12px !important;
                        background: white !important;
                    `;
                    expandBtn.innerHTML = '🛡️ I am done.';
                    expandBtn.style.position = 'fixed';
                    expandBtn.style.top = '20px';
                    expandBtn.style.right = '20px';
                    expandBtn.style.zIndex = '1000000';
                } else {
                    container.style.cssText = originalStyles;
                    expandBtn.innerHTML = 'Read Uninterrupted, Social Butterfly';
                    expandBtn.style.position = 'static';
                    expandBtn.style.margin = '10px auto';
                }
            });

            container.parentNode.insertBefore(expandBtn, container);
        });
        </script>

    </body>
</html>
